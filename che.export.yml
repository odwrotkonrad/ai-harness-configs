# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
ai/base/macos:
  options:
    runIf:
      - builtin:isOs == macos
  include:
    profiles:
      - source: "./profiles/base"
        profile: ai/base
      - source: "./profiles/claude"
        profile: ai/claude
      - source: "./profiles/codex"
        profile: ai/codex

ai/host/macos:
  options:
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt == false
  include:
    profiles:
      - ai/base/macos
      - source: "./profiles/ollama"
        profile: ai/ollama

ai/virt/linux:
  options:
    runIf:
      - builtin:isOs == linux
  include:
    profiles:
      - source: "./profiles/base"
        profile: ai/base
      - source: "./profiles/claude"
        profile: ai/claude
      - source: "./profiles/codex"
        profile: ai/codex
##[<] 🤖🤖
