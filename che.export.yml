# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
profilesDefinitions:
  'ai/base/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
    include:
      profiles:
        - specDirPath: ./profiles/base
          profileName: ai/base
        - specDirPath: ./profiles/claude
          profileName: ai/claude
        - specDirPath: ./profiles/codex
          profileName: ai/codex

  'ai/host/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
        - builtin:isVirt == false
    include:
      profiles:
        - ai/base/macos
        - specDirPath: ./profiles/ollama
          profileName: ai/ollama

  'ai/virt/linux':
    type: host
    options:
      runIf:
        - builtin:isOs == linux
    include:
      profiles:
        - specDirPath: ./profiles/base
          profileName: ai/base
        - specDirPath: ./profiles/claude
          profileName: ai/claude
        - specDirPath: ./profiles/codex
          profileName: ai/codex

##[<] 🤖🤖
