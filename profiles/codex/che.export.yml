# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

profilesDefinitions:
  'ai/codex':
    type: host
    include:
      makeLinks:
        - etc/**
      renderTemplates:
        - source: _home/**
          dest: $HOME/**
      makeDirs:
        - directories:
            - dest:
                - $HOME/.config/codex
            - dest:
                - $HOME/.local/state/codex/log
      installPackages:
        - codex

