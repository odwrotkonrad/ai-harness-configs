# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

ai/base:
  include:
    makeLinks:
      - source: _home/**
        dest: $HOME/**
      - etc/**
      - usr/**
    makeDirs:
      - directories:
          - dest:
              - "$HOME/.config/{claude,codex}"
    makeCopies:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}//repos/ai-harness/configs/ai/templates-llm"
        dest: /usr/local/scripts/shell/templates-llm
        <<<:
          - source: /git-branch-name-suggest.md.tpl
            dest: git-branch-name-suggest.md.tpl
          - source: /git-commit-msg-suggest.md.tpl
            dest: git-commit-msg-suggest.md.tpl
          - source: /git-mr-text-suggest.md.tpl
            dest: git-mr-text-suggest.md.tpl
    renderTemplates:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}//repos/ai-harness/configs/ai/ai-agents-docs"
        dest: ~/.config/ai-agents/docs
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: /system.md.ontoHost.tpl
            dest: system.md
          - source: /code.md
            dest: code.md
          - source: /comments.md
            dest: comments.md
          - source: /prose.md
            dest: prose.md
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/spec@${{ env.PROSE_SPEC_REF }}//conventions/conventions.md"
        dest: ~/.config/ai-agents/docs/conventions.md
        options:
          skipAutoGeneratedHeader: true
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}//repos/ai-harness/configs/ai/ai-agents-templates/AGENTS.md.ontoHost.tpl"
        dest:
          - ~/.config/claude/CLAUDE.md
          - path: ~/.config/codex/AGENTS.md
            options:
              renderReferencedFiles: true
##[<] 🤖🤖
