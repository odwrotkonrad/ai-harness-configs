# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

profilesDefinitions:
  'ai/base':
    type: host
    include:
      makeLinks:
        - source: _home/**
          dest: $HOME/**
        - etc/**
        - usr/**
      makeDirs:
        - directories:
            - dest:
                - "$HOME/.config/{claude,codex}"
      makeCopies:
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/ai
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_AI_REF }}"
            filepath: prose/repos/ai-harness/ai-tools-configs/ai/templates-llm
          dest: /usr/local/scripts/shell/templates-llm
          <<<:
            - source: git-branch-name-suggest.md.tpl
              dest: git-branch-name-suggest.md.tpl
            - source: git-commit-msg-suggest.md.tpl
              dest: git-commit-msg-suggest.md.tpl
            - source: git-mr-text-suggest.md.tpl
              dest: git-mr-text-suggest.md.tpl
      renderTemplates:
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/ai
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_AI_REF }}"
            filepath: prose/repos/ai-harness/ai-tools-configs/ai/ai-agents-docs
          dest: ~/.config/ai-agents/docs
          options:
            skipAutoGeneratedHeader: true
          <<<:
            - source: system.md.ontoHost.tpl
              dest: system.md
            - source: code.md
              dest: code.md
            - source: comments.md
              dest: comments.md
            - source: prose.md
              dest: prose.md
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/ai
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_AI_REF }}"
            filepath: prose/repos/ai-harness/ai-tools-configs/ai/ai-agents-templates/AGENTS.md.ontoHost.tpl
          dest:
            - ~/.config/claude/CLAUDE.md
            - path: ~/.config/codex/AGENTS.md
              options:
                renderReferencedFiles: true

variablesDefinitions:
  profilesVariablesDefinitions:
    ai/base:
      CENTRALIZED_ASSETS_PROSE_AI_REF:
        required: true
        description: "centralized/assets/prose/ai tag the agent prose renders from"
##[<] 🤖🤖
