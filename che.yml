# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
ai/base/macos:
  options:
    runIf:
      - builtin:isOs == macos
  include:
    profiles:
      - source: "./profiles/base/che.yml::ai/base"
      - source: "./profiles/claude/che.yml::ai/claude"
      - source: "./profiles/codex/che.yml::ai/codex"

ai/host/macos:
  options:
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt == false
  include:
    profiles:
      - ai/base/macos
      - source: "./profiles/ollama/che.yml::ai/ollama"

ai/virt/linux:
  options:
    runIf:
      - builtin:isOs == linux
  include:
    profiles:
      - source: "./profiles/base/che.yml::ai/base"
      - source: "./profiles/claude/che.yml::ai/claude"
      - source: "./profiles/codex/che.yml::ai/codex"

ontoRepo:
  options:
    autoDiscover: true
  include:
    profiles:
      - bootstrapCrossRepoCI
    renderTemplates:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //repos/ai-harness/ai-tools-configs/purpose.md
            dest: assets/docs-agents/purpose.md
          - source: //shared/license/LICENSE
            dest: LICENSE
          - dest: assets/data
            <<<:
              - source: //templates/2-data
                options:
                  skipAutoGeneratedHeader: false
                <<<:
                  - source: /makefile-agents.md.ontoRepo.tpl
                    dest: makefile.agents.md
                  - source: /repo-structure.md.ontoRepo.tpl
                    dest: repo-structure.md
          - source: //repos/ai-harness/ai-tools-configs/templates/3-audience
            options:
              skipAutoGeneratedHeader: false
            <<<:
              - source: /README.md.ontoRepo.tpl
                dest: README.md
              - source: /AGENTS.md.ontoRepo.tpl
                dest:
                  - CLAUDE.md
                  - path: AGENTS.md
                    options:
                      renderReferencedFiles: true

bootstrapCrossRepoCI:
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/cross-repo/misc@${{ env.MISC_REF }}//che.yml::bootstrapCrossRepoCITagging"

claude-agents:
  options:
    autoDiscover: true
    runIf:
      - builtin:isVirt
  include:
    profiles:
      - source: "./profiles/claude/che.yml::claude/virt"
        ctx:
          repo: AiConfigs

envSeed:
  include:
    renderTemplates:
      - source: .env.tpl
        dest:
          - path: .env
            options:
              writeType: mergeUpsert
##[<] 🤖🤖
